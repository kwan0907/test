name: MF Send Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mf-send-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original send-bet flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-mf
          mkdir audit-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d audit-mf
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("audit-mf/init.js").read_text("utf-8",errors="ignore")
          needles=[
            "發送注項",
            "加入注項",
            "mf007_submit",
            "mf007_send",
            "autobet",
            "autoBet",
            "sendMessage",
            "clickBet",
            "betslip",
            "addToSlip",
            "confirm",
            "submitBet",
            "mf007_cbsubmit",
            "mf007_calbetSubmit"
          ]
          for n in needles:
              print("\n====",n,"====")
              pos=0;c=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  x=re.sub(r"\s+"," ",s[max(0,i-2600):min(len(s),i+5200)])
                  print(x[:7800])
                  c+=1;pos=i+len(n)
                  if c>=10: break
          PY
