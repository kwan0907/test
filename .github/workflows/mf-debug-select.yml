name: MF Debug Selection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mf-debug-select.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact selection controls
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-mf
          mkdir audit-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d audit-mf
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("audit-mf/init.js").read_text("utf-8",errors="ignore")
          needles=[
            "mf007_fs_input","mf007_bt_input","mf007_bt_input2",
            "mf007_hno_F","mf007_hno_banker","mf007_calbet",
            "mf007_betErr","mf007_dataArea"
          ]
          for n in needles:
              print("\n===",n,"===")
              pos=0; c=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  a=max(0,i-900); b=min(len(s),i+1500)
                  x=re.sub(r"\s+"," ",s[a:b])
                  print(x[:2400])
                  c+=1; pos=i+len(n)
                  if c>=6: break
          PY
