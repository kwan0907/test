name: MF Odds ID Debug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mf-odds-id-debug.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact odds id construction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-mf
          mkdir audit-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d audit-mf
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("audit-mf/init.js").read_text("utf-8",errors="ignore")
          for needle in ["#odds_","wpbank1_QIN_","wpbank1_QPL_"]:
              print("\n===",needle,"===")
              pos=0; n=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  x=s[max(0,i-3500):min(len(s),i+5000)]
                  x=re.sub(r"\s+"," ",x)
                  print(x[:8500])
                  pos=i+len(needle); n+=1
                  if n>=5: break
          PY
