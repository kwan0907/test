name: MF Decode Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mf-decode-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original source head and quickBuy contexts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-mf
          mkdir audit-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d audit-mf
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("audit-mf/init.js").read_text("utf-8",errors="ignore")
          print("=== HEAD ===")
          print(s[:12000])
          print("\n=== QUICKBUY LITERAL CONTEXTS ===")
          for needle in [".mf007_quickBuy","preview-dfjs","confirm","mf007_submitAutoBetErr"]:
              print("\n--",needle,"--")
              pos=0;c=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  print(s[max(0,i-4000):min(len(s),i+7000)])
                  pos=i+len(needle);c+=1
                  if c>=8: break
          PY
