name: Build MF Standalone ZIP
on:
  push:
    branches: [main]
    paths:
      - 'mf-local-patch/**'
      - '.github/workflows/build-mf-standalone.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full local standalone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mf verify-orig
          mkdir build-mf verify-orig
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d build-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d verify-orig
          rm -rf build-mf/__MACOSX verify-orig/__MACOSX

          cp mf-local-patch/local_unlock.js build-mf/local_unlock.js
          cp mf-local-patch/local_full.js build-mf/local_full.js
          cp mf-local-patch/local_popup_unlock.js build-mf/local_popup_unlock.js
          cp mf-local-patch/local_popup.js build-mf/local_popup.js

          python - <<'PY'
          import json
          from pathlib import Path

          # Keep the original MF UI/core, but replace its unbounded
          # requestAnimationFrame element waiter. In logged-out/local mode
          # some selectors never appear; the original helper then polls the
          # whole HKJC DOM every animation frame forever, and repeated startup
          # calls can accumulate until Chrome reports the page as unresponsive.
          ip=Path("build-mf/init.js")
          s=ip.read_text("utf-8")
          old="const isElementLoaded=async _0x152404=>{var _0x437631=_0x1f25;while(document[_0x437631(0x13b)](_0x152404)===null){await new Promise(_0x2f496a=>requestAnimationFrame(_0x2f496a));}return document[_0x437631(0x13b)](_0x152404);},delay="
          new="const _mfWaiters=new Map(),_mfWaitTick=setInterval(()=>{_mfWaiters.forEach((_mfv,_mfs)=>{const _mfel=document.querySelector(_mfs);if(_mfel){_mfWaiters.delete(_mfs);_mfv.resolve(_mfel);}});},250),isElementLoaded=_0x152404=>{const _mfel=document.querySelector(_0x152404);if(_mfel)return Promise.resolve(_mfel);if(_mfWaiters.has(_0x152404))return _mfWaiters.get(_0x152404).promise;let _mfresolve;const _mfpromise=new Promise(_mfr=>{_mfresolve=_mfr;});_mfWaiters.set(_0x152404,{promise:_mfpromise,resolve:_mfresolve});return _mfpromise;},delay="
          if s.count(old)!=1:
              raise SystemExit(f"Expected exactly one isElementLoaded helper, found {s.count(old)}")
          s=s.replace(old,new,1)

          # Start an entirely local session inside the original UI. The
          # request itself is intercepted by local_unlock.js, so nothing is
          # sent to MoneyFlow007 and no third-party account is created.
          tail=";}});function _0xee1c(){"
          if s.count(tail)!=1:
              raise SystemExit(f"Expected one ready-function tail, found {s.count(tail)}")
          s=s.replace(tail,";}setTimeout(function(){try{_0x4a06b5('LOCAL','','','1');}catch(_mfe){}},100);});function _0xee1c(){",1)
          ip.write_text(s,"utf-8")

          p=Path("build-mf/popup.html")
          s=p.read_text("utf-8")
          if "local_popup_unlock.js" not in s:
              s=s.replace('<script src="/popup.js"></script>', '<script src="local_popup_unlock.js"></script>\n    <script src="/popup.js"></script>')
          if "local_popup.js" not in s:
              s=s.replace("</body>", '<script src="local_popup.js"></script>\n</body>')
          p.write_text(s,"utf-8")

          m=Path("build-mf/manifest.json")
          d=json.loads(m.read_text("utf-8"))
          for cs in d.get("content_scripts",[]):
              js=[x for x in cs.get("js",[]) if x not in ("local_unlock.js","local_full.js")]
              try:
                  i=js.index("init.js")
              except ValueError:
                  i=len(js)
              js.insert(i,"local_unlock.js")
              js.insert(i+1,"local_full.js")
              cs["js"]=js
          d["version"]="9.3.3.5"
          d["description"]="賽馬熱錢流聰明投注系統 - 本機計算版"
          m.write_text(json.dumps(d,ensure_ascii=False,indent=4)+"\n","utf-8")
          PY

          node --check build-mf/init.js
          node --check build-mf/local_unlock.js
          node --check build-mf/local_full.js
          node --check build-mf/local_popup_unlock.js
          node --check build-mf/local_popup.js

          # Everything except the single wait-helper patch in init.js must
          # remain byte-for-byte identical to the original package.
          for f in popup.js background.js cors.js jquery.js mf007_styles.css fontawesome.js; do
            test "$(sha256sum "verify-orig/$f" | awk '{print $1}')" = "$(sha256sum "build-mf/$f" | awk '{print $1}')"
          done
          grep -q '_mfWaiters=new Map()' build-mf/init.js
          grep -q "_0x4a06b5('LOCAL'" build-mf/init.js
          grep -q 'local_unlock.js' build-mf/manifest.json
          grep -q 'local_full.js' build-mf/manifest.json
          grep -q 'local_popup_unlock.js' build-mf/popup.html
          grep -q 'local_popup.js' build-mf/popup.html

          rm -f MF_QuickBet_9_3_3_STANDALONE.zip
          (cd build-mf && zip -qr ../MF_QuickBet_9_3_3_STANDALONE.zip .)
          unzip -t MF_QuickBet_9_3_3_STANDALONE.zip

      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MF_QuickBet_9_3_3_STANDALONE.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build MF standalone full local feature mode [skip ci]"
          git push
