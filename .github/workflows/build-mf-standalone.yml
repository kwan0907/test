name: Build MF Standalone ZIP
on:
  push:
    branches: [main]
    paths:
      - 'mf-local-patch/**'
      - '.github/workflows/build-mf-standalone.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full local standalone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-mf verify-orig
          mkdir build-mf verify-orig
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d build-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d verify-orig
          rm -rf build-mf/__MACOSX verify-orig/__MACOSX

          cp mf-local-patch/local_full.js build-mf/local_full.js
          cp mf-local-patch/local_popup.js build-mf/local_popup.js

          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("build-mf/popup.html")
          s=p.read_text("utf-8")
          if "local_popup.js" not in s:
              s=s.replace("</body>", '<script src="local_popup.js"></script>\n</body>')
          p.write_text(s,"utf-8")

          m=Path("build-mf/manifest.json")
          d=json.loads(m.read_text("utf-8"))
          for cs in d.get("content_scripts",[]):
              js=[x for x in cs.get("js",[]) if x!="local_full.js"]
              try:
                  i=js.index("init.js")
              except ValueError:
                  i=len(js)
              js.insert(i,"local_full.js")
              cs["js"]=js
          d["version"]="9.3.3.2"
          d["description"]="賽馬熱錢流聰明投注系統 - 本機計算版"
          m.write_text(json.dumps(d,ensure_ascii=False,indent=4)+"\n","utf-8")
          PY

          node --check build-mf/local_full.js
          node --check build-mf/local_popup.js

          for f in init.js popup.js background.js cors.js jquery.js mf007_styles.css; do
            test "$(sha256sum "verify-orig/$f" | awk '{print $1}')" = "$(sha256sum "build-mf/$f" | awk '{print $1}')"
          done

          grep -q 'local_full.js' build-mf/manifest.json
          grep -q 'local_popup.js' build-mf/popup.html

          rm -f MF_QuickBet_9_3_3_STANDALONE.zip
          (cd build-mf && zip -qr ../MF_QuickBet_9_3_3_STANDALONE.zip .)
          unzip -t MF_QuickBet_9_3_3_STANDALONE.zip

      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MF_QuickBet_9_3_3_STANDALONE.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build MF standalone local smart calculator [skip ci]"
          git push
