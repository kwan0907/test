name: Build MF Standalone ZIP
on:
  push:
    branches: [main]
    paths:
      - 'mf-standalone-src/**'
      - '.github/workflows/build-mf-standalone.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          rm -f MF_QuickBet_9_3_3_STANDALONE.zip
          cd mf-standalone-src
          zip -r ../MF_QuickBet_9_3_3_STANDALONE.zip .
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MF_QuickBet_9_3_3_STANDALONE.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build MF standalone ZIP [skip ci]"
          git push
