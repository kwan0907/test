name: HKJC Matrix Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hkjc-matrix-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current HKJC Q matrix render
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed -A "Mozilla/5.0" -sS "https://bet.hkjc.com/static/js/main.0a8a63e2.js" -o /tmp/m.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("/tmp/m.js").read_text("utf-8",errors="ignore")
          needles=[
            '"QIN"==',
            '"QPL"==',
            'oddsNodes.filter',
            'bankerOdds',
            'combString',
            'wpq',
            'qin',
            'qpl',
            'oddsValue'
          ]
          for n in needles:
              print("\n====",n,"====")
              pos=0;c=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  x=re.sub(r"\s+"," ",s[max(0,i-3500):min(len(s),i+6000)])
                  # Prefer snippets that mention horse-racing matrix concepts.
                  if any(k in x for k in ["pmPools","oddsNodes","bankerOdds","QIN","QPL"]):
                      print(x[:9500])
                      c+=1
                  pos=i+len(n)
                  if c>=12: break
          PY
