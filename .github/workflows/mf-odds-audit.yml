name: MF Odds Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mf-odds-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original smart-calc odds flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-mf
          mkdir audit-mf
          unzip -q "MF_QuickBet_9_3_3 (2).zip" -d audit-mf
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("audit-mf/init.js").read_text("utf-8",errors="ignore")
          needles=[
            "rsdatacalbet4b.aspx",
            "rsdatacalbet",
            "info.cld.hkjc.com",
            "graphql",
            "oddsValue",
            "bankerOdds",
            "betCalQin",
            "mf007_calbet",
            "mf007_val",
            "mf007_betval"
          ]
          for n in needles:
              print("\n====",n,"====")
              pos=0; count=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  a=max(0,i-2200); b=min(len(s),i+3600)
                  x=re.sub(r"\s+"," ",s[a:b])
                  print(x[:5800])
                  count+=1
                  pos=i+len(n)
                  if count>=8: break
          PY
